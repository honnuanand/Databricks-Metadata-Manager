version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: metadata_manager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metadata_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metadata_manager_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metadata_manager_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/metadata_manager
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-secret-key-change-in-production
      DATABRICKS_HOST: ${DATABRICKS_HOST}
      DATABRICKS_TOKEN: ${DATABRICKS_TOKEN}
      CORS_ORIGINS: http://localhost:4001,http://localhost:5001
      DEBUG: "true"
    volumes:
      - ./backend:/app
    ports:
      - "8080:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: metadata_manager_frontend
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./front-end:/app
      - /app/node_modules
    ports:
      - "4001:5173"
    depends_on:
      - backend

volumes:
  postgres_data: